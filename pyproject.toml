[project]
name = "langchain-course2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Xabi CF", email = "xcostas@optaresolutions.com" }
]
requires-python = ">=3.10"
dependencies = [
    "arize-phoenix>=20.16.0",
    "black>=26.10.1",
    "isort>=9.0.2",
    "langchain>=1.4.9",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.4",
    "openinference-instrumentation-langchain>=0.1.82",
    "opentelemetry-exporter-otlp>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
    "python-dotenv>=1.2.4",
]

[project.scripts]
langchain-course2 = "langchain_course2:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
